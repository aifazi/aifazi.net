services:
  - type: web
    name: aifazi-backend
    runtime: docker
    dockerfilePath: ./aifazi.net-backend-fastapi/Dockerfile
    dockerContext: ./aifazi.net-backend-fastapi
    plan: starter
    region: oregon
    healthCheckPath: /api/health
    envVars:
      - key: PASETO_SECRET
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: ADMIN_USERNAME
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: INTERNAL_API_SECRET
        sync: false
      - key: ADMIN_GATE_SECRET
        sync: false
      - key: CRON_SECRET
        sync: false
      - key: FIVEM_SERVER_SECRET
        sync: false
      - key: FRONTEND_URL
        value: https://aifazi.net
      - key: SENTRY_DSN
        sync: false
      - key: ENV
        value: production
