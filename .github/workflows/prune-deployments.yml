name: Prune Old Deployments (keep only current)

# Runs after every push to main (which triggers Vercel + Railway auto-deploys)
# and removes all old deployment builds so only the current one remains on
# Vercel, Railway, and GitHub. Manual trigger also supported.

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: prune-deployments
  cancel-in-progress: false

jobs:
  prune:
    name: Keep only current deployment
    runs-on: ubuntu-latest
    permissions:
      deployments: write
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Wait for new deployments to be created
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Give Vercel/Railway a moment to start creating their deployment
          # records before we compute what is "old". Deployments created after
          # this job started are always kept.
          sleep 45

      - name: Prune Vercel deployments
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          GITHUB_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          if [ -z "$VERCEL_TOKEN" ]; then
            echo "::warning::VERCEL_TOKEN secret not set — skipping Vercel prune."
            exit 0
          fi
          TEAM_ID="team_nL9SXzDbhzUHFNR2xaPzWldV"
          # projectName|projectId
          PROJECTS="aifazi-website-new|prj_KbPCKEO6LvFztKF6GEIn0y2x7cmx
                    aifazi-backend|prj_Va1GHAH4Rhabm2MicoxuS62iSWY3"

          while IFS='|' read -r NAME PROJ; do
            [ -z "$NAME" ] && continue
            # Newest READY production deployment for this project. We only keep a
            # finished, serving production build — if the newest production
            # deployment is still BUILDING/ERROR/QUEUED we abort the prune so the
            # live deployment (and any fallback before it) is never deleted while
            # a replacement is not actually live yet.
            NEWEST=$(curl -fsS \
              -H "Authorization: Bearer $VERCEL_TOKEN" \
              "https://api.vercel.com/v6/deployments?projectId=${PROJ}&target=production&limit=100&teamId=${TEAM_ID}" \
              | jq -r '[.deployments[]? | select(.target == "production" and .state == "READY")] | sort_by(.created) | reverse | .[0].uid // empty' 2>/dev/null || true)
            if [ -z "$NEWEST" ]; then
              echo "::warning::[$NAME] no READY production deployment found — skipping prune to protect the live deployment."
              continue
            fi
            echo "[$NAME] current production deployment: $NEWEST"
            # Delete every PRODUCTION deployment except the newest READY one.
            # Preview/staging deployments are a separate environment and are
            # deliberately left untouched.
            CURSOR=""
            while :; do
              URL="https://api.vercel.com/v6/deployments?projectId=${PROJ}&limit=100&teamId=${TEAM_ID}"
              [ -n "$CURSOR" ] && URL="${URL}&until=${CURSOR}"
              RESP=$(curl -fsS -H "Authorization: Bearer $VERCEL_TOKEN" "$URL")
              COUNT=$(echo "$RESP" | jq '[.deployments[]?.uid] | length' 2>/dev/null || echo 0)
              IDS=$(echo "$RESP" | jq -r '[.deployments[]? | select(.target == "production" and .uid != $newest) | .uid] | .[]' --arg newest "$NEWEST" 2>/dev/null || true)
              [ "${COUNT:-0}" -eq 0 ] && break
              for ID in $IDS; do
                curl -fsS -X DELETE \
                  -H "Authorization: Bearer $VERCEL_TOKEN" \
                  "https://api.vercel.com/v13/deployments/${ID}?teamId=${TEAM_ID}" >/dev/null || \
                  echo "::warning::Vercel delete failed: $ID"
                echo "[$NAME] deleted $ID"
              done
              CURSOR=$(echo "$RESP" | jq -r '.pagination.next // empty')
              [ -z "$CURSOR" ] && break
            done
          done <<< "$PROJECTS"

      - name: Prune Railway deployments
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "$RAILWAY_TOKEN" ]; then
            echo "::warning::RAILWAY_TOKEN secret not set — skipping Railway prune."
            exit 0
          fi
          SERVICE_ID="da51fadf-76d5-4f4a-96af-90877d7aafdc"
          QUERY='query { service(id: "'"$SERVICE_ID"'") { deployments(orderBy: {createdAt: DESC}) { edges { node { id status } } } } }'
          PAYLOAD=$(jq -nc --arg q "$QUERY" '{query:$q}')
          EDGES=$(curl -fsS \
            -H "Authorization: Bearer $RAILWAY_TOKEN" \
            -H "Content-Type: application/json" \
            -H "User-Agent: railway-cli" \
            -d "$PAYLOAD" \
            https://backboard.railway.com/graphql/v2 \
            | jq -c '.data.service.deployments.edges[]?.node')
          # Newest SUCCESS deployment = the one serving traffic. Fail-closed: if
          # there is no SUCCESS deployment yet (or the newest is still building),
          # abort before deleting anything — never prune while a replacement may
          # not be live, and never delete a build that could be rolled back to.
          NEWEST=$(echo "$EDGES" | jq -sr '[.[] | select(.status == "SUCCESS")][0].id // empty')
          if [ -z "$NEWEST" ]; then
            echo "::warning::No SUCCESS Railway deployment found — skipping prune to protect the live deployment."
            exit 0
          fi
          echo "Current Railway deployment: $NEWEST"
          echo "$EDGES" | jq -sr '.[] | select(.status == "SUCCESS" and .id != $newest) | .id' --arg newest "$NEWEST" | while read -r DEP; do
            [ -z "$DEP" ] && continue
            if [ "$DEP" != "$NEWEST" ]; then
              MUT='mutation { deploymentRemove(id: "'"$DEP"'") { id } }'
              MP=$(jq -nc --arg m "$MUT" '{query:$m}')
              curl -fsS \
                -H "Authorization: Bearer $RAILWAY_TOKEN" \
                -H "Content-Type: application/json" \
                -H "User-Agent: railway-cli" \
                -d "$MP" \
                https://backboard.railway.com/graphql/v2 >/dev/null || \
                echo "::warning::Railway delete failed: $DEP"
              echo "deleted $DEP"
            fi
          done

      - name: Prune GitHub deployment records
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          # Keep only the newest deployment record per environment; delete the rest.
          gh api "repos/${GITHUB_REPO}/deployments" --paginate \
            -q '.[] | [.id,.environment,.created_at] | @tsv' > /tmp/deps.tsv
          if [ ! -s /tmp/deps.tsv ]; then
            echo "No deployment records to prune."
            exit 0
          fi
          awk -F'\t' '{ print $2 "\t" $1 "\t" $3 }' /tmp/deps.tsv | sort > /tmp/envs.tsv
          CURRENT_ENV=""
          while IFS=$'\t' read -r ENV ID CREATED; do
            if [ "$ENV" != "$CURRENT_ENV" ]; then
              CURRENT_ENV="$ENV"
              # First row of each env is the newest (sorted, keeps first per env).
              echo "[$ENV] keeping $ID"
              continue
            fi
            # The GitHub API only allows deleting deployments whose latest
            # status is "inactive". Other states (e.g. "success") make the
            # DELETE fail with HTTP 422, which surfaces as noisy warnings.
            gh api -X POST "repos/${GITHUB_REPO}/deployments/${ID}/statuses" -f state=inactive >/dev/null || true
            gh api -X DELETE "repos/${GITHUB_REPO}/deployments/${ID}" >/dev/null || \
              echo "::warning::GitHub record delete failed: $ID"
            echo "[$ENV] deleted record $ID"
          done < /tmp/envs.tsv
