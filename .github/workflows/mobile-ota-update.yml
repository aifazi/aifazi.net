name: Mobile OTA Update

on:
  push:
    branches:
      - main
    paths:
      - "apps/mobile/**"
  release:
    types: [published]

concurrency:
  group: mobile-ota-${{ github.ref }}
  cancel-in-progress: false

jobs:
  update:
    name: EAS Update (production)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check for EXPO_TOKEN
        run: |
          if [ -z "${{ secrets.EXPO_TOKEN }}" ]; then
            echo "You must provide an EXPO_TOKEN secret linked to this project's Expo account in this repo's secrets. Learn more: https://docs.expo.dev/eas-update/github-actions"
            exit 1
          fi

      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: apps/mobile/package-lock.json

      - name: Setup EAS
        uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Install dependencies
        working-directory: apps/mobile
        run: npm install

      - name: Publish OTA update
        working-directory: apps/mobile
        run: |
          MESSAGE="CI auto-update: ${{ github.event_name }}"
          if [ "${{ github.event_name }}" = "release" ]; then
            MESSAGE="Release ${{ github.event.release.tag_name }}"
          fi
          if [ -n "${{ github.event.head_commit.message }}" ]; then
            MESSAGE="$(echo "${{ github.event.head_commit.message }}" | head -n 1)"
          fi
          eas update --channel production --environment production --message "$MESSAGE" --auto
