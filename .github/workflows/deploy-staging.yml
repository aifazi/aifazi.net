name: Deploy Staging

on:
  push:
    branches: [develop]
  workflow_dispatch:

env:
  NODE_VERSION: '22'
  PYTHON_VERSION: '3.12'

jobs:
  build-frontend:
    name: Build Frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: aifazi.net-frontend-next
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: aifazi.net-frontend-next/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build Next.js application
        run: npm run build
        env:
          NEXT_PUBLIC_API_URL: https://api-staging.aifazi.net

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: frontend-build
          path: aifazi.net-frontend-next/.next/
          retention-days: 1

  build-backend:
    name: Build Backend Docker Image
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: aifazi.net-backend-fastapi
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build backend image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: docker/backend/Dockerfile
          push: false
          tags: aifazi-backend:staging-${{ github.sha }}
          load: true

      - name: Save backend image
        run: docker save aifazi-backend:staging-${{ github.sha }} | gzip > backend-image.tar.gz

      - name: Upload backend image
        uses: actions/upload-artifact@v4
        with:
          name: backend-image
          path: backend-image.tar.gz
          retention-days: 1

  deploy-staging:
    name: Deploy to Staging
    needs: [build-frontend, build-backend]
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/develop'
    environment: staging
    steps:
      - name: Download frontend build
        uses: actions/download-artifact@v4
        with:
          name: frontend-build
          path: .next/

      - name: Download backend image
        uses: actions/download-artifact@v4
        with:
          name: backend-image
          path: .

      - name: Deploy to Vercel (Frontend Staging)
        uses: amondnet/vercel-action@v25
        if: ${{ secrets.VERCEL_STAGING_TOKEN != '' }}
        with:
          vercel-token: ${{ secrets.VERCEL_STAGING_TOKEN }}
          vercel-org-id: ${{ secrets.VERCEL_ORG_ID }}
          vercel-project-id: ${{ secrets.VERCEL_PROJECT_ID }}
          vercel-args: '--prod=false'
          working-directory: ./aifazi.net-frontend-next

      - name: Deploy to Railway (Backend Staging)
        if: ${{ secrets.RAILWAY_STAGING_TOKEN != '' }}
        run: |
          echo "Deploying backend to Railway staging..."
          # Railway CLI deployment would go here
          # railway up --service backend-staging --token ${{ secrets.RAILWAY_STAGING_TOKEN }}

      - name: Run Staging Smoke Tests
        if: always()
        run: |
          echo "Running smoke tests against staging..."
          # curl -f https://staging.aifazi.net/api/health || exit 1
          # curl -f https://api-staging.aifazi.net/api/health || exit 1

  notify-success:
    name: Notify Success
    needs: deploy-staging
    if: success()
    runs-on: ubuntu-latest
    steps:
      - name: Notify
        run: echo "Staging deployment successful!"

  notify-failure:
    name: Notify Failure
    needs: deploy-staging
    if: failure()
    runs-on: ubuntu-latest
    steps:
      - name: Notify
        run: echo "Staging deployment failed!"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true