name: Mobile Release Build

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to attach the build to (leave blank to use the latest release)"
        required: false

concurrency:
  group: mobile-release-build
  cancel-in-progress: false

jobs:
  build-android:
    name: Build Android (AAB) and attach to release
    runs-on: ubuntu-latest
    timeout-minutes: 120
    permissions:
      contents: write
    steps:
      - name: Check for EXPO_TOKEN
        run: |
          if [ -z "${{ secrets.EXPO_TOKEN }}" ]; then
            echo "You must provide an EXPO_TOKEN secret linked to this project's Expo account in this repo's secrets. Learn more: https://docs.expo.dev/build/building-on-ci"
            exit 1
          fi

      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: apps/mobile/package-lock.json

      - name: Setup EAS
        uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Install dependencies
        working-directory: apps/mobile
        run: npm install

      - name: Resolve release tag
        id: tag
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="${{ github.event.release.tag_name }}"
          if [ -n "${{ github.event.inputs.tag }}" ]; then
            TAG="${{ github.event.inputs.tag }}"
          fi
          if [ -z "$TAG" ]; then
            TAG=$(gh release list --limit 1 --json tagName -q '.[0].tagName')
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

      - name: Start EAS Android build
        id: build
        working-directory: apps/mobile
        run: |
          eas build --platform android --profile production --non-interactive --json > build-output.json
          cat build-output.json
          echo "build_id=$(jq -r '.[0].id // .id' build-output.json)" >> "$GITHUB_OUTPUT"

      - name: Wait for build to finish
        working-directory: apps/mobile
        run: |
          BUILD_ID="${{ steps.build.outputs.build_id }}"
          echo "Build ID: $BUILD_ID"
          for i in $(seq 1 240); do
            STATUS=$(eas build:view "$BUILD_ID" --json --non-interactive 2>/dev/null | jq -r '.status')
            echo "Attempt $i: status=$STATUS"
            if [ "$STATUS" = "FINISHED" ]; then
              echo "Build finished."
              exit 0
            fi
            if [ "$STATUS" = "CANCELED" ] || [ "$STATUS" = "ERRORED" ]; then
              echo "Build failed with status: $STATUS" >&2
              exit 1
            fi
            sleep 30
          done
          echo "Timed out waiting for build" >&2
          exit 1

      - name: Download AAB
        working-directory: apps/mobile
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: |
          BUILD_ID="${{ steps.build.outputs.build_id }}"
          URL=$(eas build:view "$BUILD_ID" --json --non-interactive 2>/dev/null | jq -r '.artifacts.applicationArchiveUrl // .artifacts.buildUrl')
          if [ -z "$URL" ] || [ "$URL" = "null" ]; then
            echo "No artifact URL found for build $BUILD_ID" >&2
            exit 1
          fi
          echo "Downloading from: $URL"
          curl -fL -H "Authorization: Bearer $EXPO_TOKEN" "$URL" -o aifazi-${{ steps.tag.outputs.tag }}.aab
          ls -la aifazi-${{ steps.tag.outputs.tag }}.aab

      - name: Upload AAB to release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload "${{ steps.tag.outputs.tag }}" apps/mobile/aifazi-${{ steps.tag.outputs.tag }}.aab --clobber
