name: Mobile Release Build

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to attach the build to (leave blank to use the latest release)"
        required: false

concurrency:
  group: mobile-release-build
  cancel-in-progress: false

jobs:
  set-version:
    # Single source of truth for the version: stamp app.json from the release
    # tag AND commit the bump back to main, so downstream consumers (EAS
    # Update / mobile-ota-update.yml) always publish against the current
    # release version instead of a stale committed one.
    name: Bump app.json from release tag and commit back to main
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Resolve release tag
        id: tag
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="${{ github.event.release.tag_name }}"
          if [ -n "${{ github.event.inputs.tag }}" ]; then
            TAG="${{ github.event.inputs.tag }}"
          fi
          if [ -z "$TAG" ]; then
            TAG=$(gh release list --limit 1 --json tagName -q '.[0].tagName')
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

      - name: Set app version from release tag
        working-directory: apps/mobile
        env:
          APP_VERSION: ${{ steps.tag.outputs.tag }}
        run: |
          # appVersionSource is "local", so the APK's versionName AND versionCode
          # come from app.json. Stamp both from the release tag so:
          #   1) the in-app updater's getInstalledVersion() reports the real
          #      version (no more stuck "1.0.0"), and
          #   2) versionCode increases monotonically per release (maj*1e6 +
          #      min*1e3 + patch), which is what makes Android treat the APK as
          #      an actual UPDATE instead of a no-op re-install.
          node <<'EOF'
          const fs = require('fs');
          const v = process.env.APP_VERSION.replace(/^v/i, '').trim();
          const [maj = 0, min = 0, pat = 0] = v.split('.').map(Number);
          const app = JSON.parse(fs.readFileSync('app.json', 'utf8'));
          app.expo.version = v;
          app.expo.android = app.expo.android || {};
          app.expo.android.versionCode = maj * 1000000 + min * 1000 + pat;
          fs.writeFileSync('app.json', JSON.stringify(app, null, 2) + '\n');
          console.log("version=" + v + " versionCode=" + app.expo.android.versionCode);
          EOF

      - name: Commit and push version bump back to main
        working-directory: apps/mobile
        env:
          APP_VERSION: ${{ steps.tag.outputs.tag }}
        run: |
          if git diff --quiet -- app.json; then
            echo "app.json is already at $APP_VERSION — nothing to commit"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app.json
          # [skip ci] prevents this push from re-triggering the
          # push-based mobile-auto-release.yml workflow (infinite release loop).
          git commit -m "chore(mobile): bump app version to $APP_VERSION [skip ci]"
          git pull --rebase origin main
          git push origin main
          echo "Committed and pushed app.json version bump to main"

  build-android:
    name: Build Android APK and attach to release
    needs: set-version
    runs-on: ubuntu-latest
    timeout-minutes: 120
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: apps/mobile/package-lock.json

      - name: Setup JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install dependencies
        working-directory: apps/mobile
        run: npm ci

      - name: Resolve release tag
        id: tag
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="${{ github.event.release.tag_name }}"
          if [ -n "${{ github.event.inputs.tag }}" ]; then
            TAG="${{ github.event.inputs.tag }}"
          fi
          if [ -z "$TAG" ]; then
            TAG=$(gh release list --limit 1 --json tagName -q '.[0].tagName')
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

      - name: Set app version from release tag
        working-directory: apps/mobile
        env:
          APP_VERSION: ${{ steps.tag.outputs.tag }}
        run: |
          # appVersionSource is "local", so the APK's versionName AND versionCode
          # come from app.json. Stamp both from the release tag so:
          #   1) the in-app updater's getInstalledVersion() reports the real
          #      version (no more stuck "1.0.0"), and
          #   2) versionCode increases monotonically per release (maj*1e6 +
          #      min*1e3 + patch), which is what makes Android treat the APK as
          #      an actual UPDATE instead of a no-op re-install.
          node <<'EOF'
          const fs = require('fs');
          const v = process.env.APP_VERSION.replace(/^v/i, '').trim();
          const [maj = 0, min = 0, pat = 0] = v.split('.').map(Number);
          const app = JSON.parse(fs.readFileSync('app.json', 'utf8'));
          app.expo.version = v;
          app.expo.android = app.expo.android || {};
          app.expo.android.versionCode = maj * 1000000 + min * 1000 + pat;
          fs.writeFileSync('app.json', JSON.stringify(app, null, 2) + '\n');
          console.log("version=" + v + " versionCode=" + app.expo.android.versionCode);
          EOF

      - name: Generate Android project
        working-directory: apps/mobile
        run: |
          npx expo prebuild --platform android --no-install
          echo "React Native architectures: $(grep '^reactNativeArchitectures=' android/gradle.properties)"

      - name: Write release signing keystore
        working-directory: apps/mobile/android
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$ANDROID_KEYSTORE_BASE64" ]; then
            echo "The ANDROID_KEYSTORE_BASE64 secret is required for a release build." >&2
            echo "Generate one with: keytool -genkey -v -keystore release.keystore -alias aifazi -keyalg RSA -keysize 2048 -validity 10000" >&2
            echo "Then: base64 -w0 release.keystore" >&2
            exit 1
          fi
          echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > app/release.keystore
          if [ ! -s app/release.keystore ]; then
            echo "Decoded keystore is empty — check the ANDROID_KEYSTORE_BASE64 secret." >&2
            exit 1
          fi

      - name: Build release APK
        working-directory: apps/mobile/android
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          ./gradlew assembleRelease \
            -PMYAPP_UPLOAD_STORE_FILE=release.keystore \
            -PMYAPP_UPLOAD_STORE_PASSWORD="$ANDROID_KEYSTORE_PASSWORD" \
            -PMYAPP_UPLOAD_KEY_ALIAS="$ANDROID_KEY_ALIAS" \
            -PMYAPP_UPLOAD_KEY_PASSWORD="$ANDROID_KEY_PASSWORD"

      - name: Copy APK to workspace
        working-directory: apps/mobile
        run: |
          cp android/app/build/outputs/apk/release/app-release.apk \
            "aifazi-${{ steps.tag.outputs.tag }}.apk"
          ls -la "aifazi-${{ steps.tag.outputs.tag }}.apk"

      - name: Upload artifact to release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload "${{ steps.tag.outputs.tag }}" apps/mobile/aifazi-${{ steps.tag.outputs.tag }}.apk --clobber
