version: 2
updates:
  # Frontend dependencies (Next.js, React, etc.)
  - package-ecosystem: "npm"
    directory: "aifazi.net-frontend-next"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
      timezone: "UTC"
    open-pull-requests-limit: 10
    reviewers:
      - "aifazi"
    labels:
      - "dependencies"
      - "frontend"
    commit-message:
      prefix: "chore(frontend)"
      prefix-development: "chore(frontend)"
    groups:
      react-ecosystem:
        patterns:
          - "react*"
          - "@types/react*"
          - "next*"
          - "@next/*"
      tailwind-ui:
        patterns:
          - "tailwind*"
          - "@tailwindcss/*"
          - "postcss*"
          - "autoprefixer"
      testing:
        patterns:
          - "jest*"
          - "@testing-library/*"
          - "vitest*"
          - "playwright*"
      linting:
        patterns:
          - "eslint*"
          - "@typescript-eslint/*"
          - "prettier*"
          - "stylelint*"
      build-tools:
        patterns:
          - "webpack*"
          - "vite*"
          - "turbo*"
          - "esbuild*"

  # Backend dependencies (Python)
  - package-ecosystem: "pip"
    directory: "aifazi.net-backend-fastapi"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
      timezone: "UTC"
    open-pull-requests-limit: 10
    reviewers:
      - "aifazi"
    labels:
      - "dependencies"
      - "backend"
    commit-message:
      prefix: "chore(backend)"
      prefix-development: "chore(backend)"
    groups:
      fastapi-ecosystem:
        patterns:
          - "fastapi*"
          - "uvicorn*"
          - "starlette*"
          - "pydantic*"
      database:
        patterns:
          - "supabase*"
          - "psycopg*"
          - "asyncpg*"
          - "sqlalchemy*"
          - "alembic*"
      security:
        patterns:
          - "cryptography*"
          - "bcrypt*"
          - "pyjwt*"
          - "paseto*"
      monitoring:
        patterns:
          - "sentry*"
          - "prometheus*"
          - "opentelemetry*"

  # GitHub Actions
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
      timezone: "UTC"
    open-pull-requests-limit: 10
    reviewers:
      - "aifazi"
    labels:
      - "dependencies"
      - "github-actions"

  # Mobile dependencies (npm via Expo)
  - package-ecosystem: "npm"
    directory: "apps/mobile"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
      timezone: "UTC"
    open-pull-requests-limit: 10
    reviewers:
      - "aifazi"
    labels:
      - "dependencies"
      - "mobile"
    # Expo SDK 57 pairs with react-native 0.86.3 / safe-area-context ~5.7.0 /
    # svg 15.15.4 (expo bundledNativeModules). RN 0.87's AGP requires Gradle
    # 9.4.1+, which expo-gradle-plugin's Kotlin 2.1.20 cannot compile against
    # (expo/expo#49550) - Android release builds fail (#469 pins the pairing).
    # expo >=58 = deliberate SDK migration (a partial group bump ERESOLVEs,
    # see #474). eslint >=10: eslint-plugin-react via eslint-config-expo still
    # calls context.getFilename() (removed in eslint 10) and peers ^9.7
    # (see #475). In-range patch/minor updates stay allowed for all of these.
    ignore:
      - dependency-name: "react-native"
        versions: [">=0.87.0"]
      - dependency-name: "react-native-safe-area-context"
        versions: [">=5.8.0"]
      - dependency-name: "react-native-svg"
        versions: [">=15.15.5"]
      - dependency-name: "expo*"
        versions: [">=58.0.0"]
      - dependency-name: "eslint"
        versions: [">=10.0.0"]
    commit-message:
      prefix: "chore(mobile)"
      prefix-development: "chore(mobile)"
    groups:
      expo-ecosystem:
        patterns:
          - "expo*"
          - "@expo/*"
          - "react-native*"
          - "@react-native/*"
      react-navigation:
        patterns:
          - "@react-navigation/*"
          - "react-native-gesture-handler"
          - "react-native-reanimated"
          - "react-native-screens"
      ui:
        patterns:
          - "nativewind*"
          - "tailwindcss*"
          - "lucide-react-native*"
          - "@gorhom/*"

  # Docker images
  - package-ecosystem: "docker"
    directory: "docker/backend"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
      timezone: "UTC"
    open-pull-requests-limit: 5
    reviewers:
      - "aifazi"
    labels:
      - "dependencies"
      - "docker"

  - package-ecosystem: "docker"
    directory: "aifazi.net-backend-fastapi"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
      timezone: "UTC"
    open-pull-requests-limit: 5
    reviewers:
      - "aifazi"
    labels:
      - "dependencies"
      - "docker"
