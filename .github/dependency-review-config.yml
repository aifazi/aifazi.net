# Configuration for actions/dependency-review-action
# https://github.com/actions/dependency-review-action

# Fail if a dependency has a vulnerability with severity >= high
fail-on-severity: high

# Allow specific licenses (SPDX identifiers)
allow-licenses:
  - MIT
  - Apache-2.0
  - BSD-2-Clause
  - BSD-3-Clause
  - ISC
  - CC0-1.0
  - CC-BY-4.0
  - CC-BY-SA-4.0
  - Unlicense
  - Zlib
  - Python-2.0

# Configuration for npm
npm:
  # Ignore specific vulnerabilities (use sparingly, with justification)
  # ignored-vulnerabilities:
  #   - GHSA-xxxx-xxxx-xxxx: "Reason for ignoring"

# Configuration for pip
pip:
  # Ignore specific vulnerabilities
  # ignored-vulnerabilities:
  #   - GHSA-xxxx-xxxx-xxxx: "Reason for ignoring"

# Maximum number of vulnerabilities to report (default: 100)
# NOTE: `max-vulnerabilities` is NOT a key in the action's config schema
# (removed 2026-10-05, R6-2 — it was silently ignored). No valid equivalent
# is needed: `fail-on-severity: high` above already fails the PR on ANY
# introduced high-or-worse vulnerability (strictly stricter than tolerating
# up to N), and the `allow-licenses` allowlist below is enforced now that
# `ci.yml` passes this file via the `config-file` input (R6-1). Do NOT add
# `deny-licenses` alongside `allow-licenses` — the action treats them as
# mutually exclusive (and `deny-licenses` is deprecated upstream).

# Round-5 audit (A5-3): `severity-threshold` and `allowed-registries` were
# removed — the action's schema does not know these keys and silently ignored
# them. `fail-on-severity` above is the real severity control. This file is
# loaded only via the `config-file` input in `.github/workflows/ci.yml`
# (R6-1 — the action never auto-loads it).