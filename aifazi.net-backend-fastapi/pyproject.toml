[tool.ruff]
target-version = "py312"
line-length = 120

# Only check for actual errors/bugs, ignore style and pre-existing patterns
lint.ignore = [
    "BLE001",  # bare except
    "PLW0602", # global variable
    "S110",    # try/except/pass
    "S112",    # try/except/continue (intentional pattern)
    "G201",    # logger.exception
    "E501",    # line too long
    "E701",    # multiple statements on one line
    "E702",    # multiple statements with semicolon
    "UP017",   # datetime.UTC
    "RUF001",  # ambiguous unicode
    "B904",    # raise from
    "SIM105",  # contextlib.suppress
    "E402",    # import not at top
    "RET504",  # unnecessary assignment
    "F841",    # unused variable
    "B008",    # Depends in argument defaults (widespread pattern)
    "C401",    # unnecessary generator
    "FURB162", # unnecessary timezone replacement
    "F401",    # unused import (routers/__init__.py pattern)
    "SIM102",  # nested if statements
    "RUF013",  # implicit Optional
    "DTZ005",  # datetime.now() without tz
    "SIM103",  # return negated condition
    "RUF015",  # next(iter())
    "RUF059",  # unpacked unused
    "PIE810",  # startswith tuple
    "UP041",   # asyncio.TimeoutError
    "C403",    # list comprehension
    "I001",    # import sorting
    "SIM102",  # nested if
    "E722",    # bare except
    "F821",    # undefined name
]

[tool.ruff.lint.per-file-ignores]
"tests/**/*" = ["S101"]