services:
  clamav:
    image: clamav/clamav:1.4
    container_name: clamav
    restart: unless-stopped
    mem_limit: 2g
    mem_reservation: 1g
    cpus: 2
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - coolify
    volumes:
      - clamav-data:/var/lib/clamav
      - /opt/clamav/clamd.conf:/etc/clamav/clamd.conf:ro
    sysctls:
      - net.ipv6.conf.all.disable_ipv6=1
      - net.ipv6.conf.default.disable_ipv6=1
    healthcheck:
      test: ["CMD", "clamdcheck.sh"]
      interval: 60s
      timeout: 20s
      retries: 3
      start_period: 300s

volumes:
  clamav-data:

networks:
  coolify:
    external: true
