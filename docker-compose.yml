# ── aifazi.net — local development docker-compose ──────────────────────────────
# Start:   docker compose up -d --build
# Stop:    docker compose down
# Logs:    docker compose logs -f
# Rebuild: docker compose up -d --build
#
# Uses PRODUCTION Supabase — no local Supabase services.
# The browser connects to the production Supabase URL directly.
# The backend connects to production Supabase via its service role key.

services:
  clamav:
    image: clamav/clamav:stable
    container_name: aifazi-clamav
    # No host ports — the backend reaches clamd via the compose network as
    # `clamav:3310`. Virus definitions persist in the named volume across
    # container rebuilds (freshclam downloads signatures on first boot).
    volumes:
      - clamav-db:/var/lib/clamav
    environment:
      - CLAMD_STARTUP_TIMEOUT=180s
      - CLAMAV_NO_FRESHCLAMD=false
    networks:
      - aifazi-net
    restart: unless-stopped
    mem_limit: 2g
    mem_reservation: 1g
    cpus: 2
    # First boot downloads the signature DB, so clamd can take a while to
    # become responsive — give the healthcheck a generous start period.
    healthcheck:
      test: ['CMD', 'clamdcheck.sh']
      interval: 60s
      timeout: 20s
      retries: 3
      start_period: 90s

  backend:
    build:
      context: .
      dockerfile: docker/backend/Dockerfile
    container_name: aifazi-backend
    ports:
      - '127.0.0.1:8000:8000'
    volumes:
      - ./aifazi.net-backend-fastapi:/app
      - /app/__pycache__
    env_file:
      - .env.local
    environment:
      # Point the backend at the compose ClamAV service. Scanning stays opt-in:
      # uploads are only scanned when MALWARE_SCAN_ENABLED=true is also set.
      - CLAMD_HOST=clamav
      - CLAMD_PORT=3310
    depends_on:
      clamav:
        condition: service_healthy
    networks:
      - aifazi-net
    restart: unless-stopped
    mem_limit: 1g
    mem_reservation: 512m
    cpus: 2
    healthcheck:
      test: ['CMD', 'python', '-c', "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/health')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s

  frontend:
    build:
      context: .
      dockerfile: docker/frontend/Dockerfile
    container_name: aifazi-frontend
    ports:
      - '127.0.0.1:3000:3000'
    volumes:
      - ./aifazi.net-frontend-next:/app
      - /app/node_modules
      - /app/.next
    env_file:
      - .env.local
    depends_on:
      - backend
    networks:
      - aifazi-net
    restart: unless-stopped
    mem_limit: 2g
    mem_reservation: 512m
    cpus: 2
    healthcheck:
      test: ['CMD', 'wget', '--spider', '--quiet', 'http://localhost:3000']
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

networks:
  aifazi-net:
    driver: bridge

volumes:
  clamav-db:
    driver: local
